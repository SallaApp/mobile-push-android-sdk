name: CI

# The SDK's whole verification, on every pull request and every push to master: each step of the job android-sdk is one
# step of scripts/verify.sh, the script a developer runs before pushing (CONTRIBUTING.md), so CI and a local run check
# the same things; the job Shell scripts runs bash -n and shellcheck on every script. publish.yml calls this workflow
# again on a release tag, with the tagged commit, before anything is published.
on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      ref:
        description: Commit to verify (empty = the event's commit)
        type: string
        required: false
        default: ''

# The prefix keeps a call from publish.yml out of publish.yml's own concurrency group.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every step runs in bash -eo pipefail.
defaults:
  run:
    shell: bash

jobs:
  android-sdk:
    name: android-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      # Validates gradle-wrapper.jar against Gradle's published checksums. The open-source "basic" cache, not the
      # default commercial caching service; it is written on master only.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      # Robolectric downloads its android-all jars (about 310 MB for API 23, 26 and 34) into
      # ~/.m2/repository/org/robolectric, which setup-gradle does not cache. Every run restores them; only a push to master
      # saves them (below), so pull requests never write caches. The key follows the Robolectric version and the
      # default SDK level; a test that adds another level downloads that jar until the key changes.
      - name: Restore the Robolectric android-all jars
        id: robolectric
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('sallapush/build.gradle.kts', 'sallapush/src/test/resources/robolectric.properties') }}

      - name: The checks catch what they exist to catch (scripts/self-test.sh)
        run: scripts/self-test.sh
      - name: Declared version and its CHANGELOG entry
        run: scripts/verify.sh version
      - name: Golden payloads are the SallaPush server's contract
        run: scripts/verify.sh goldens
      - name: Log codes match the shared log catalogue
        run: scripts/verify.sh catalogue
      - name: Markdown links resolve inside the repository
        run: scripts/verify.sh links
      - name: No secret, build output or link in the tree; required files; pinned actions
        run: scripts/verify.sh tree
      - name: Gradle wrapper (official distribution, pinned checksum, Gradle's own wrapper jar)
        run: scripts/verify.sh wrapper
      # check = unit tests (Robolectric), Android lint, apiCheck and the log catalogue coverage; then the AAR into
      # mavenLocal, and the minified sample (R8 proves the consumer rules).
      - name: check, apiCheck, publishToMavenLocal, sample assembleRelease
        run: scripts/verify.sh build
      - name: Save the Robolectric android-all jars
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.robolectric.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric.outputs.cache-primary-key }}
      - name: consumer-check resolves the published coordinates
        run: scripts/verify.sh consumer
      - name: POM coordinates and dependencies
        run: scripts/verify.sh pom
      - name: Grep, default-argument and bytecode gates
        run: scripts/verify.sh gates
      - name: README snippets match the sample (with the checker's self-test)
        run: scripts/verify.sh snippets
      # Fails when SallaPush adds more than 5 MB (5,242,880 bytes) to an app, which is also size-report.sh's default
      # budget; the report prints the exact size and WorkManager's share every run.
      - name: Size gate (fails above 5 MB, 5,242,880 bytes)
        run: scripts/verify.sh size

  # Every script CI, a release and the publication run: bash -n with the runner's bash, then shellcheck, from the image
  # pinned by the digest of koalaman/shellcheck:v0.11.0's image index. Re-confirm the digest with Docker Hub's registry
  # API (the docker-content-digest of manifests/v0.11.0); the iOS SDK pins the same one.
  shell-scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: bash -n and shellcheck (scripts/*.sh, .github/scripts/*.sh)
        run: |
          set -euo pipefail
          for script in scripts/*.sh .github/scripts/*.sh; do
            bash -n "$script"
          done
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            -x -S style scripts/*.sh .github/scripts/*.sh

  # The one check a pull request needs for a green pipeline: it fails unless every job above succeeded or was skipped.
  testing-ready:
    name: Testing Ready
    if: always()
    needs: [android-sdk, shell-scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job above succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::a job this check needs ended with $result"; exit 1 ;;
            esac
          done
          echo "every job succeeded or was skipped: $RESULTS"
